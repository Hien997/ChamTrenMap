name: CI

# The five ship gates, cheapest first — exactly `npm run check`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `.env` is gitignored, so CI builds from the template. The build only
      # needs the variables to exist — every route is dynamic, so nothing
      # queries the database at build time (verified: `next build` exits 0
      # against an unreachable DATABASE_URL).
      - name: Provide build env
        run: cp .env.example .env

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check
        run: npm run check
