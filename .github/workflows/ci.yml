name: CI

# The five ship gates, cheapest first — exactly `npm run check`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `next build` prerenders the ISR routes (`/`, `/tours`, `/sitemap`) at
    # build time, so it needs a real database to query. No production data is
    # required — those pages render a perfectly good empty state — so the
    # runner gets a throwaway Postgres whose credentials already match
    # `.env.example` (postgres:postgres@localhost:5432/cham_tren_map).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cham_tren_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `.env` is gitignored, so CI builds from the template — and the template
      # already points at the service container above.
      - name: Provide build env
        run: cp .env.example .env

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Empty schema, zero rows: exactly what the prerender needs to reach its
      # empty state instead of a PrismaClientInitializationError.
      - name: Create schema
        run: npx prisma db push

      - name: Check
        run: npm run check
